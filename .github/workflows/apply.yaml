name: apply

# Delivery is still a pull: this job only tells den to reconcile sooner than
# its timer would. den is never exposed; the runner joins the tailnet for the
# length of the job and the action's post step logs it out again.
#
# If this ever stops working the timer still converges den daily, so a red run
# here costs latency, not correctness.
on:
  push:
    branches: [main]
    paths:
      - "mgmt/**"
      - ".github/workflows/apply.yaml"
  workflow_dispatch:

concurrency:
  group: apply
  cancel-in-progress: false

env:
  GCP_PROJECT: mklv-infrastructure
  WIF_PROVIDER: projects/443065563587/locations/global/workloadIdentityPools/github/providers/github-oidc

jobs:
  apply:
    name: converge den
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # No service account to impersonate: Secret Manager grants read to this
      # repository's own federated identity, so the token is the whole claim.
      - name: authenticate to gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - uses: google-github-actions/setup-gcloud@v3

      # Neither value is a credential. They are read here rather than written
      # into this file so the infrastructure repo stays the only author.
      - name: read tailscale identity
        run: |
          set -euo pipefail
          identity=$(gcloud secrets versions access latest \
            --secret="tailscale-ci-den" \
            --project="$GCP_PROJECT")
          {
            echo "TS_CLIENT_ID=$(jq -r .CLIENT_ID <<<"$identity")"
            echo "TS_AUDIENCE=$(jq -r .AUDIENCE <<<"$identity")"
          } >> "$GITHUB_ENV"

      # Workload identity federation again, this time to Tailscale: the runner
      # proves who it is with its own OIDC token and no secret is stored.
      - name: join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: tag:ci
          hostname: den-apply
          ping: den

      # Tailscale SSH authenticates by tailnet identity, so no key is deployed
      # and no secret is involved. The ACL decides that tag:ci may be root.
      #
      # Through systemd rather than the script directly: an SSH-invoked script
      # reparents to init when the runner leaves the tailnet, escaping both the
      # unit's TimeoutStartSec and its OnFailure alert. One such orphan wedged
      # on etcd's port for ten hours and blocked every later reconcile.
      - name: converge
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              root@den 'systemctl start --wait den-reconcile.service'

      - name: converge logs
        if: always()
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              root@den 'journalctl -u den-reconcile.service -n 200 --no-pager' || true
