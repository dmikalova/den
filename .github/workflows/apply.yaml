name: apply

# Delivery is still a pull: this job only tells den to reconcile sooner than
# its timer would. den is never exposed; the runner joins the tailnet for the
# length of the job and the action's post step logs it out again.
#
# TODO: restore the push trigger once three things are true. Until then every
# push to mgmt/** fails here, which trains us to ignore a red run.
#   1. dmikalova/den carries a workloadIdentityUser binding for the tailscale
#      secrets, applied from the infrastructure repo
#   2. den has joined the tailnet as tag:den with --ssh
#   3. /usr/local/bin/den-reconcile exists on den
#
# on:
#   push:
#     branches: [main]
#     paths:
#       - "mgmt/**"
#       - ".github/workflows/apply.yaml"
on:
  workflow_dispatch:

concurrency:
  group: apply
  cancel-in-progress: false

env:
  GCP_PROJECT: mklv-infrastructure
  WIF_PROVIDER: projects/443065563587/locations/global/workloadIdentityPools/github/providers/github-oidc

jobs:
  apply:
    name: converge den
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # No service account to impersonate: Secret Manager grants read to this
      # repository's own federated identity, so the token is the whole claim.
      - name: authenticate to gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - uses: google-github-actions/setup-gcloud@v3

      # Neither value is a credential. They are read here rather than written
      # into this file so the infrastructure repo stays the only author.
      - name: read tailscale identity
        run: |
          set -euo pipefail
          for key in client-id audience; do
            var=$(echo "TS_${key}" | tr 'a-z-' 'A-Z_')
            value=$(gcloud secrets versions access latest \
              --secret="tailscale-ci-den-${key}" \
              --project="$GCP_PROJECT")
            echo "${var}=${value}" >> "$GITHUB_ENV"
          done

      # Temporary. The token exchange returns 403 and Tailscale exposes no API
      # for trust credentials, so the claims are the only way to see which side
      # disagrees. Prints the claims, never the token.
      - name: show oidc claims
        run: |
          set -euo pipefail
          tok=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${TS_AUDIENCE}" | jq -r .value)
          payload=$(printf '%s' "$tok" | cut -d. -f2)
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          printf '%s%s' "$payload" "$(printf '=%.0s' $(seq 1 $pad))" \
            | tr '_-' '/+' | base64 -d | jq '{sub, aud, iss}'
          echo "tailscale expects audience: ${TS_AUDIENCE}"

      # Workload identity federation again, this time to Tailscale: the runner
      # proves who it is with its own OIDC token and no secret is stored.
      - name: join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: tag:ci
          hostname: den-apply
          ping: den

      # Tailscale SSH authenticates by tailnet identity, so no key is deployed
      # and no secret is involved. The ACL decides that tag:ci may be root.
      - name: converge
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              root@den den-reconcile
