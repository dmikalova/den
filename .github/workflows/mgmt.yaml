name: mgmt

# Upstream publishes one Linux binary and it is linked against libxml2.so.2,
# which Ubuntu 26.04 does not ship and has no compat package for. So den builds
# its own and serves it from this repo's releases.
#
# The build runs inside an ubuntu:26.04 container on purpose: the binary has to
# link against the same sonames den has, and the runner image is older.
#
# Upstream's own packaging is not reusable: they have no release workflow, and
# misc/mkosi targets ubuntu-bionic in the retired mkosi.default format.
#
# TODO: recheck upstream on each version bump. The day purpleidea ships a build
# that runs on current Ubuntu, delete this file and point installMgmt back.

on:
  workflow_dispatch:
    inputs:
      version:
        description: mgmt release tag to build
        required: true
        default: "1.1.0"
      publish:
        description: attach the binary to den's newest release
        type: boolean
        default: true
  # The binary hangs off den's newest release, so a release without this job
  # leaves bootstrap downloading a 404. A `release: published` trigger looks
  # like the answer and silently is not: the release is cut with the default
  # GITHUB_TOKEN, and GitHub refuses to start a workflow from an event that
  # token raised. So CI/CD calls this directly once it has tagged.
  workflow_call:
    inputs:
      version:
        description: mgmt release tag to build
        required: true
        type: string
      publish:
        description: attach the binary to den's newest release
        type: boolean
        default: true
  push:
    paths:
      - ".github/workflows/mgmt.yaml"

permissions:
  contents: read

env:
  # The fallback only covers the push trigger, which builds to prove the
  # recipe still compiles and publishes nothing.
  MGMT_VERSION: ${{ inputs.version || '1.1.0' }}
  # mgmt's go.mod asks for 1.25.7 and pins x/tools v0.41.0. That combination is
  # held together by funcgen, which runs x/tools and cannot read export data
  # from a newer toolchain. Bumping both together works and is worth it: this
  # binary runs as root on den, and an older toolchain means shipping known
  # stdlib CVEs. Bump the two as a pair or not at all.
  GO_VERSION: "1.27.2"
  X_TOOLS_VERSION: "v0.52.0"
  GOTOOLCHAIN: local

jobs:
  build:
    name: build mgmt
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: install build dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git \
            libaugeas-dev libvirt-dev libpcap0.8-dev \
            gettext packagekit ragel

      - name: install go
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/go.tgz \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # mgmt generates its lexer and parser at build time rather than vendoring
      # the output, so these are build inputs, not dev conveniences. The x/tools
      # binaries must match the version the build itself resolves.
      - name: install go build tools
        run: |
          set -euo pipefail
          go install github.com/blynn/nex@latest
          go install "golang.org/x/tools/cmd/goyacc@${X_TOOLS_VERSION}"
          go install "golang.org/x/tools/cmd/stringer@${X_TOOLS_VERSION}"
          go install "golang.org/x/tools/cmd/goimports@${X_TOOLS_VERSION}"

      - name: fetch mgmt source
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git clone --recursive --branch "$MGMT_VERSION" --depth 1 \
            https://github.com/purpleidea/mgmt /tmp/mgmt

      - name: build
        working-directory: /tmp/mgmt
        run: |
          set -euo pipefail
          go get "golang.org/x/tools@${X_TOOLS_VERSION}"
          make build

      - name: package
        run: |
          set -euo pipefail
          bin="mgmt-linux-amd64-${MGMT_VERSION}"
          install -m 0755 /tmp/mgmt/mgmt "$bin"
          ./"$bin" --version
          ldd ./"$bin"
          sha256sum "$bin" > mgmt-SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mgmt
          path: |
            mgmt-linux-amd64-*
            mgmt-SHA256SUMS

  release:
    name: publish
    needs: build
    # The push trigger supplies no inputs, so editing this file builds to prove
    # the recipe still compiles and attaches nothing.
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mgmt

      # The asset rides den's own release rather than a mgmt-prefixed tag of
      # its own. den's release tooling reads the newest tag in the repo and
      # parses it as semver, so any extra tag series breaks versioning.
      # Assets are named so they cannot collide with den's own.
      - name: attach to latest den release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "attaching mgmt $MGMT_VERSION to den $tag"
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            mgmt-linux-amd64-* mgmt-SHA256SUMS
