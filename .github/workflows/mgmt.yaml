name: mgmt

# Upstream publishes one Linux binary and it is linked against libxml2.so.2,
# which Ubuntu 26.04 does not ship and has no compat package for. So den builds
# its own and serves it from this repo's releases.
#
# The build runs inside an ubuntu:26.04 container on purpose: the binary has to
# link against the same sonames den has, and the runner image is older.
#
# Upstream's own packaging is not reusable: they have no release workflow, and
# misc/mkosi targets ubuntu-bionic in the retired mkosi.default format.
#
# TODO: recheck upstream on each version bump. The day purpleidea ships a build
# that runs on current Ubuntu, delete this file and point installMgmt back.

on:
  workflow_dispatch:
    inputs:
      version:
        description: mgmt release tag to build
        required: true
        default: "1.1.0"
  push:
    paths:
      - ".github/workflows/mgmt.yaml"

permissions:
  contents: read

env:
  MGMT_VERSION: ${{ inputs.version || '1.1.0' }}
  # Match mgmt's go.mod exactly. Newer is not safer here: funcgen runs
  # x/tools v0.41.0, which cannot read export data from a later toolchain and
  # fails with "package sync without types" into a /dev/null'd stdout.
  GO_VERSION: "1.25.7"
  GOTOOLCHAIN: local

jobs:
  build:
    name: build mgmt
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: install build dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git \
            libaugeas-dev libvirt-dev libpcap0.8-dev \
            gettext packagekit ragel

      - name: install go
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/go.tgz \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # mgmt generates its lexer and parser at build time rather than vendoring
      # the output, so these are build inputs, not dev conveniences. The x/tools
      # binaries track the version mgmt pins, since @latest would demand a
      # toolchain newer than funcgen tolerates.
      - name: install go build tools
        run: |
          set -euo pipefail
          go install github.com/blynn/nex@latest
          go install golang.org/x/tools/cmd/goyacc@v0.41.0
          go install golang.org/x/tools/cmd/stringer@v0.41.0
          go install golang.org/x/tools/cmd/goimports@v0.41.0

      - name: fetch mgmt source
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git clone --recursive --branch "$MGMT_VERSION" --depth 1 \
            https://github.com/purpleidea/mgmt /tmp/mgmt

      - name: build
        working-directory: /tmp/mgmt
        run: make build

      - name: package
        run: |
          set -euo pipefail
          bin="mgmt-linux-amd64-${MGMT_VERSION}"
          install -m 0755 /tmp/mgmt/mgmt "$bin"
          ./"$bin" --version
          ldd ./"$bin"
          sha256sum "$bin" > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mgmt
          path: |
            mgmt-linux-amd64-*
            SHA256SUMS

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mgmt

      # The tag is prefixed so that these never collide with den's own tags.
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="mgmt-${MGMT_VERSION}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "mgmt $MGMT_VERSION for ubuntu 26.04" \
            --notes "Unmodified upstream mgmt $MGMT_VERSION, rebuilt against Ubuntu 26.04 libraries. Upstream's own binary needs libxml2.so.2, which 26.04 does not ship." \
            mgmt-linux-amd64-* SHA256SUMS
