name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  cicd:
    name: CI/CD
    uses: dmikalova/project-standards/.github/workflows/cicd.yaml@main
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      packages: write
    secrets: inherit

  # den serves its own build of mgmt from its releases, so every release has to
  # carry one or `den bootstrap` downloads a 404. bootstrap.go is the one place
  # the version is declared; read it rather than repeating it here.
  mgmt-version:
    name: mgmt version
    needs: cicd
    if: needs.cicd.outputs.released == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          set -euo pipefail
          version=$(grep -oP 'DefaultMgmtVersion = "\K[^"]+' internal/bootstrap/bootstrap.go)
          echo "mgmt $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mgmt:
    name: mgmt
    needs: [cicd, mgmt-version]
    uses: ./.github/workflows/mgmt.yaml
    permissions:
      contents: write
    with:
      version: ${{ needs.mgmt-version.outputs.version }}
      tag: v${{ needs.cicd.outputs.version }}
