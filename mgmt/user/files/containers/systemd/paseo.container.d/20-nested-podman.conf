# Paseo agents build and run containers with rootless podman inside the
# container. See the Containers section of the paseo repo README. This
# relaxes the shared hardening in container.d for the Paseo instances only.
#
# All of this stays inside the rootless user namespace of dmikalova. Root in
# the inner namespace is a subordinate ID of dmikalova on den, not root.
[Container]
# fuse-overlayfs is the storage of the inner podman.
AddDevice=/dev/fuse
# The default podman set. Root in the inner user namespace cannot use a
# capability that is not in the bounding set of this container. The image
# entrypoint clears the ambient set, so Paseo and the agents have none.
AddCapability=CHOWN DAC_OVERRIDE FOWNER FSETID KILL SETFCAP SETGID SETPCAP SETUID SYS_CHROOT
# newuidmap and newgidmap get their file capabilities only without this.
NoNewPrivileges=false
# podman 4.3 in the image cannot mount /proc for an inner container while
# paths in this /proc are masked.
Unmask=/proc/*
SecurityLabelDisable=true
