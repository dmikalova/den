# Hardening for every quadlet on den.
#
# Quadlet merges this top-level container.d drop-in into every .container file
# it finds, so a new service is hardened before anyone remembers to harden it.
# A service that genuinely cannot live with one of these settings overrides it
# in its own <name>.container.d/, which wins because it is further down the
# hierarchy. See ollama.container.d for the one case.
#
# The alternative was read_only and friends in ~/.config/containers/
# containers.conf. Rejected: on podman 5.7.0 a container created with
# --read-only=false against that default still gets a read-only rootfs, while
# podman inspect reports it as writable, so the override silently does not
# work. Quadlet drop-ins were checked with `quadlet -dryrun` and do.
#
# Tmpfs is deliberately absent. It is a list key, so a default here would be
# added to a per-service one rather than replaced by it, and the sizes differ.
[Container]
# Nothing writes to its own image. Anything that needs to write gets a volume
# or a tmpfs, named in its own file, where it is visible and backed up on
# purpose rather than by accident.
ReadOnly=true
# No capabilities at all. These services listen on high ports and talk to
# their own files; none of them needs to bind low, change ownership, or load
# a module.
DropCapability=ALL
# No setuid binary in any image may raise privilege. With every capability
# already dropped this is belt and braces, and it is also what stops a future
# image bump from quietly reintroducing one.
NoNewPrivileges=true
# Deliberately no UserNS=keep-id. These quadlets are already rootless, so root
# inside a container is dmikalova outside it, which is what keep-id is usually
# reached for. Setting it would instead map dmikalova to UID 1000 inside,
# where an image's /root is not writable. The exception is an image whose own
# user is UID 1000, such as Paseo: there keep-id is what lets it start without
# root. That service sets it in its own file.
