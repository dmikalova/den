# ollama is the one service that cannot take the default read-only rootfs.
#
# The NVIDIA CDI hook writes the driver libraries, their symlinks and a fresh
# ld.so.cache into the container filesystem at create time. Against a
# read-only rootfs nvidia-cdi-hook exits 1, podman reports an OCI runtime
# error, and the unit fails five restarts and gives up. Measured on den both
# ways. A GPU container on the CDI path and a read-only rootfs are mutually
# exclusive.
#
# Everything else in container.d still applies: no capabilities, no new
# privileges.
[Container]
ReadOnly=false
