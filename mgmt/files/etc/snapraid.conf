# snapraid protects the pooled data drives with one parity drive: any single
# drive can be lost and rebuilt. It is not a backup. It follows deletions on the
# next sync, so the undo for an accidental delete is the snapper snapshot on
# each drive, and the copy off this host is kopia to B2.

parity /mnt/parity1/snapraid.parity

# Four copies of the content file, one per drive plus one on the root
# filesystem. The content file is the map from file to parity block, so losing
# every copy means the parity is unusable even though the drives are fine.
content /var/lib/snapraid/snapraid.content
content /mnt/disk1/snapraid.content
content /mnt/disk2/snapraid.content
content /mnt/disk3/snapraid.content

# The drive roots, not the pool. snapraid has to see which drive a file is
# actually on, which is exactly what mergerfs hides. These point at the branch
# directory, so the content files and .snapshots above stay out of the array.
data d1 /mnt/disk1/data
data d2 /mnt/disk2/data
data d3 /mnt/disk3/data

exclude *.unrecoverable
exclude /lost+found/
exclude .snapshots/
exclude *.tmp
exclude *.part
# /recover/ holds raw images of old drives during a restore; see
# docs/restore.md. The source drive is kept until its files are in kopia, so a
# lost image is made again from the drive. In parity, a multi-TB image makes
# every sync hours longer and fills the parity drive for no gain. /restore/
# holds the files from those images until they are checked; it is rebuilt
# from the image, and checked files move to /mess/. Kopia excludes both too;
# see den-kopia. TEMPORARY: remove these lines with the kopia rules when the
# extraction is done.
exclude /recover/
exclude /restore/

# Flush the content file every 500 GB of a long sync, so an interrupted first
# sync of a full drive does not start over.
autosave 500
