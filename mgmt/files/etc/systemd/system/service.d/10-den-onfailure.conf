# A top level drop-in: systemd applies every .conf under service.d/ to every
# service on the host, so this one line gives all of them, including ones that
# do not exist yet, an alert on failure. See "Top level drop-ins" in
# systemd.unit(5).
#
# Precedence is by file name across all drop-in directories, so a unit can opt
# out by shipping its own 10-den-onfailure.conf. That is exactly how
# den-notify@.service breaks the recursion.
[Unit]
OnFailure=den-notify@%N.service
