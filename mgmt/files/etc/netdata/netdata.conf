# den's metrics.
#
# This file only overrides what the package default gets wrong for this host.
# Everything else stays at Netdata's defaults, which are better tuned than
# anything guessed here.

[global]
	# One second resolution on a machine whose job is storage is a lot of
	# writes for detail nobody looks at.
	update every = 2

[db]
	# dbengine on tmpfs would lose history on every reboot and on disk it
	# writes constantly. 512 MiB is enough for a few days of this host's
	# metrics, which is the window in which anyone asks "what happened".
	mode = dbengine
	storage tiers = 1
	dbengine multihost disk space MB = 512

[web]
	# Caddy is in front. Netdata has no authentication of its own, so
	# binding anything wider would publish the host's metrics to the LAN.
	bind to = 127.0.0.1:19999

[registry]
	# The registry exists to link several Netdata nodes together through a
	# third party. There is one node.
	enabled = no
