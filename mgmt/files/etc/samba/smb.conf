# den's file shares.
#
# Reachable on the tailnet and on nothing else. ufw allows everything in on
# tailscale0 and nothing in from the LAN except ssh and mDNS, and hosts allow
# below refuses any peer that is not loopback or a tailnet address, so the
# firewall is the first answer rather than the only one.
#
# There is no guest access, no printer sharing and no NetBIOS. Every client
# that matters here speaks SMB3.

[global]
	workgroup = WORKGROUP
	server string = den
	server role = standalone server

	# Serve the tailnet and the loopback. Not the LAN: a share that is only as
	# private as the LAN is not private.
	#
	# This is hosts allow and not bind interfaces only, because Samba will not
	# bind an interface without IFF_BROADCAST, and tailscale0 is a
	# point-to-point tun that never has it. With interfaces = lo tailscale0,
	# smbd logs "not adding non-broadcast interface tailscale0" and listens on
	# loopback alone. Naming the address instead of the interface fails the
	# same way.
	#
	# 100.64.0.0/10 and fd7a:115c:a1e0::/48 are the ranges Tailscale assigns.
	hosts allow = 127.0.0.1 ::1 100.64.0.0/10 fd7a:115c:a1e0::/48
	hosts deny = ALL

	# SMB1 is not negotiable down to. Encryption is required rather than
	# offered, because the tailnet already costs nothing extra to encrypt
	# inside and an unencrypted session is one misconfigured client away.
	client min protocol = SMB3
	server min protocol = SMB3
	server smb encrypt = required

	# No name service. Tailscale resolves den, and nmbd broadcasting on a
	# network it cannot see is noise.
	disable netbios = yes
	dns proxy = no

	# No printers. This is a file server.
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

	security = user
	map to guest = never
	# Unix extensions break macOS clients and are pointless for the clients
	# this host actually has.
	unix extensions = no

	log file = /var/log/samba/log.%m
	log level = 1
	max log size = 1000
	logging = systemd

	# vfs_fruit, for the macOS clients. It has to be listed before
	# streams_xattr, and streams_xattr has to be there at all, or resource
	# forks land in AppleDouble files and Time Machine refuses the target.
	vfs objects = catia fruit streams_xattr
	fruit:metadata = stream
	fruit:model = MacSamba
	fruit:posix_rename = yes
	fruit:veto_appledouble = no
	fruit:wipe_intentionally_left_blank_rfork = yes
	fruit:delete_empty_adfiles = yes

# The array. One user, because there is one person.
[storage]
	path = /mnt/storage
	comment = den pooled storage
	browseable = yes
	read only = no
	valid users = dmikalova
	create mask = 0644
	directory mask = 0755
	# Time Machine has its own share; nothing should reach it through this one.
	veto files = /timemachine/
	delete veto files = no

[timemachine]
	path = /mnt/storage/timemachine
	comment = Time Machine
	browseable = yes
	read only = no
	valid users = dmikalova
	create mask = 0600
	directory mask = 0700

	# What makes macOS offer this share as a backup destination.
	fruit:time machine = yes
	# Without a quota Time Machine grows until the array is full, then starts
	# deleting its own history to make room it did not need. 2 TB is a bound,
	# not a reservation; it is in bytes.
	fruit:time machine max size = 2T
