# Beszel's system list. The hub syncs this into its database on every start,
# and deletes any system missing from it, so this file is the whole list.
#
# This is what replaces clicking "Add System" in the web UI.
#
# users is deliberately absent: with nobody named the hub assigns the system to
# its first account, so no address has to be hardcoded here. The token is
# likewise generated by the hub, and goes unused anyway, because the hub
# reaches this agent over SSH rather than waiting to be dialled.
systems:
  - name: den
    host: 127.0.0.1
    port: 45876
